name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run format, lint, and type checks
        if: ${{ !cancelled() }}
        run: pnpm check

      - name: Run tests
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Build workspace packages
        if: ${{ !cancelled() }}
        run: pnpm build
